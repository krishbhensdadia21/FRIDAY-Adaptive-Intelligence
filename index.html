<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>F.R.I.D.A.Y – Adaptive Intelligence System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/tokyo-night-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="bg-elements">
  <div class="glow-orb" style="width:400px;height:400px;background:var(--accent);top:-100px;left:-100px;"></div>
  <div class="glow-orb" style="width:300px;height:300px;background:var(--accent2);bottom:-50px;right:-50px;"></div>
</div>

<div class="app">
  <header>
    <div class="logo">
      <div class="logo-text">
        <h1>F.R.I.D.A.Y</h1>
      </div>
    </div>
    <div class="header-controls">
      <div class="status-pill"><div class="status-dot"></div><span id="statusLabel">ONLINE</span></div>
      <button class="clear-btn" id="clearBtn">🗑️ CLEAR</button>
    </div>
  </header>

  <div class="chat" id="chat">
    <div id="welcomeArea"></div>
  </div>

  <div class="input-area">
    <div class="chatgpt-input-container">
      <div class="input-wrapper">
        <textarea 
          class="chatgpt-textarea" 
          id="userInput" 
          placeholder="Send a message..." 
          rows="1"
        ></textarea>
        <div class="input-actions">
          <button class="icon-btn" id="micBtn" title="Voice input">🎤</button>
          <button class="send-btn" id="sendBtn" disabled>➤</button>
        </div>
      </div>
    </div>
    <div class="input-footer">
      <span>Powered by Llama 3.3 • Groq • Wikipedia • Web Search</span>
    </div>
  </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
