<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>F.R.I.D.A.Y – Adaptive Intelligence System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/tokyo-night-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="bg-elements">
  <div class="bg-pattern neural-net"></div>
  <div class="bg-pattern circuit-board"></div>
  <div class="glow-orb" style="width:400px;height:400px;background:var(--accent);top:-100px;left:-100px;"></div>
  <div class="glow-orb" style="width:300px;height:300px;background:var(--accent2);bottom:-50px;right:-50px;"></div>
</div>

<div class="app">
  <header>
    <div class="logo">
      <div class="logo-text">
        <h1>F.R.I.D.A.Y</h1>
      </div>
    </div>
    <div class="header-controls">
      <div class="status-pill"><div class="status-dot"></div><span id="statusLabel">ONLINE</span></div>
      <button class="clear-btn" id="clearBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="header-icon"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        CLEAR
      </button>
    </div>
  </header>

  <div class="chat" id="chat">
    <div id="welcomeArea"></div>
  </div>

  <div class="input-area">
    <div class="chatgpt-input-container">
      <div class="input-wrapper">
        <textarea 
          class="chatgpt-textarea" 
          id="userInput" 
          placeholder="Send a message..." 
          rows="1"
        ></textarea>
        <div class="input-actions">
          <button class="icon-btn" id="micBtn" title="Voice input">
            <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" class="mic-icon"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
          </button>
          <button class="send-btn" id="sendBtn" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="send-icon"><path d="M4 18l3-2M2 14l5-1.5M6 21l2-2.5" opacity="0.7" stroke-width="1.5"></path><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="input-footer">
      <span>F.R.I.D.A.Y can make mistakes. Consider checking important info.</span>
    </div>
  </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
